name: Game problem
description: A game crashes, freezes, runs slowly or looks wrong
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fields below are what a game problem is traced with; without them the first reply is a request for them.
        **Never attach game files, keys, title keys or anything extracted from a game** (RomFS, NSOs, shaders). Logs and screenshots are fine.
        If the problem is that the build or the install to a device fails, use the Build problem form instead.
  - type: input
    id: game
    attributes:
      label: Game, title ID and versions
      description: The game's name, its title ID, the base version and the update version, as the launcher shows them for the game (or as you packed them).
      placeholder: "NieR:Automata The End of YoRHa Edition, 0100B8E016F76000, base 1.0.0, update 1.0.1"
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Where it runs
      options:
        - Mac app (built for This Mac)
        - iPhone or iPad (built for iPhone / iPad)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, chip and RAM
      description: The Mac, iPhone or iPad model with its chip and memory (Apple menu > About This Mac, or Settings > General > About).
      placeholder: iPad Pro 11-inch, M1, 16 GB
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS or iOS / iPadOS version
      placeholder: iPadOS 26.1
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How it was installed
      description: For an iPhone or iPad, "from the launcher" (Install on device) or the sideloading tool and its version (Sideloadly, AltStore, SideStore, Xcode...). For a Mac app, say that you run the app the launcher built.
      placeholder: Sideloadly 0.50, free Apple ID
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NX2Apple version
      description: The version shown under Settings, or the release you downloaded. Copy diagnostics (below) also has it.
      placeholder: v0.4.8
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and when
      description: What you did and what you saw, and when (at the menu, in game, after how many minutes). Say whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: textarea
    id: options
    attributes:
      label: Launch options changed from the defaults
      description: The game's launch options (the button beside Play, with render scale, frame rate and more) that you changed, and any mods. Write "none" if you changed nothing.
      placeholder: "Render scale 100%, Frame rate 30"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Copy diagnostics
      description: In the launcher, Settings > Copy diagnostics, then paste it here. It holds the app version, the build tools' commit, Python and .NET, the dependency check and the last build log lines. Keys are left out and your home folder is shortened to `~`.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The game's log
      description: |
        Attach the whole log of the run (drag the file here), not excerpts:
        - Mac app: `log/<title ID>.log` in the library folder next to the game's app (the run before is `<title ID>.prev.log`). A game outside a library folder writes `~/Library/Logs/nxnative/<title ID>.log`.
        - iPhone or iPad: `log.txt` in the Files app, under the app's name (the run before is `log.prev.txt`).
    validations:
      required: true
  - type: input
    id: fork-patches
    attributes:
      label: Fork patches line
      description: "The first line of the game's log (`fork patches: ...`): the patches this build carries beyond upstream's engine. Optional, but it says whether a report belongs here or with seedds/nxnative."
      placeholder: "fork patches: runtime-profile, romfsarc, ..."
    validations:
      required: false
  - type: textarea
    id: performance
    attributes:
      label: Screenshots and performance numbers
      description: For a wrong picture, a screenshot. For slow running, the Metal HUD (set `DM_METAL_HUD=1`, or turn it on in the launch options) with the frame rate it shows, and the render scale and frame rate you used.
    validations:
      required: false
  - type: checkboxes
    id: no-game-files
    attributes:
      label: No keys, no game files
      options:
        - label: Nothing attached here contains keys, game files or data extracted from a game.
          required: true
