name: Launcher problem or idea
description: A problem with the NX2Apple app itself (library, settings, update, controller) or an idea for it
body:
  - type: markdown
    attributes:
      value: |
        For a game that crashes or looks wrong, use the Game problem form. For a failing build, use the Build problem form.
        Never attach keys, game files or anything extracted from a game.
  - type: dropdown
    id: kind
    attributes:
      label: This is
      options:
        - A problem
        - An idea
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, or what you would like
      description: For a problem, the steps and what you saw (a screenshot helps). For an idea, what you want to do and what is in the way.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: NX2Apple version
      description: The version shown under Settings, or the release you downloaded.
      placeholder: v0.4.8
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer and OS
      placeholder: MacBook Pro M2 Max, macOS 26.1
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Copy diagnostics
      description: For a problem, Settings > Copy diagnostics, pasted here. Keys are left out and your home folder is shortened to `~`. Not needed for an idea.
      render: markdown
    validations:
      required: false
  - type: checkboxes
    id: no-game-files
    attributes:
      label: No keys, no game files
      options:
        - label: Nothing attached here contains keys, game files or data extracted from a game.
          required: true
