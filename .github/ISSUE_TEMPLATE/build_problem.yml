name: Build problem
description: A launcher-side build, signing or device-install problem (not nxnative extract, rewrite or shader tools)
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This form is for **launcher-side** problems: dependency and key checks, NSZ decompression, file or queue handling, Xcode signing, app or IPA packaging, and installing to a device.
        **Do not report failures inside the nxnative build tools here** (`nx_extract`, code rewrite or `Pipeline`, `dmsh` shader capture / split / translation, or unsupported games). Those tools live in https://github.com/seedds/nxnative and cannot be fixed in this repository. Report them at https://github.com/seedds/nxnative/issues instead, as well as any game that builds and then crashes, freezes or looks wrong.
        **Never attach game files, keys, title keys or anything extracted from a game.** Logs and screenshots are fine.
  - type: dropdown
    id: step
    attributes:
      label: Which step failed
      description: The launcher, signing or install stage where it stopped. Failures inside nxnative extract, rewrite, Pipeline or shader tools go to https://github.com/seedds/nxnative/issues instead.
      options:
        - The key or dependency check, before the build
        - Decompress NSZ
        - Starting or queuing the build in the launcher
        - Prepare Xcode, signing or IPA pack
        - Mac app (packing or signing the app)
        - Install to an iPhone or iPad (Xcode, devicectl, local signing)
        - Updating the engine or the build tools
        - Something else (launcher-side)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: The message
      description: The error the launcher shows or the red line in the log, copied as text. A screenshot is welcome too.
    validations:
      required: true
  - type: textarea
    id: buildlog
    attributes:
      label: Build log
      description: In the launcher, the Builds page > Build log. Attach the whole log as a file (drag the file into this box). Paste it only when it is short. A pasted text can hold at most 65,536 characters in total.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Copy diagnostics
      description: In the launcher, Settings > Copy diagnostics, then paste it here. It holds the app version, the build tools' commit, Python and .NET, and the dependency check. Keys are left out and your home folder is shortened to `~`.
      render: markdown
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game, title ID and versions
      description: The game's name, its title ID, the base version and the update version.
      placeholder: "NieR:Automata The End of YoRHa Edition, 0100B8E016F76000, base 1.0.0, update 1.0.1"
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Built for
      options:
        - This Mac
        - iPhone / iPad
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Game files
      description: What the games folder holds for this game.
      options:
        - NSP
        - NSZ
        - XCI
        - Several of these, or a base game with updates and DLC
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer and OS
      placeholder: MacBook Pro M2 Max, macOS 26.1
    validations:
      required: true
  - type: input
    id: fork-patches
    attributes:
      label: Fork patches line
      description: "The patches your build carries beyond upstream's engine: the first line of the game app's log (`fork patches: ...`), or the contents of `engine/dm/fork_patches.txt` (`dm/fork_patches.txt` in an older copy) in the NX2Apple folder you built from. Optional."
      placeholder: "fork patches: runtime-profile, ios-game-data-folder, ..."
    validations:
      required: false
  - type: checkboxes
    id: launcher-scope
    attributes:
      label: Launcher scope
      options:
        - label: This is a launcher, environment, signing or device-install problem, not a failure inside an nxnative build tool (extract, rewrite, Pipeline or shader tools go to seedds/nxnative).
          required: true
  - type: checkboxes
    id: no-game-files
    attributes:
      label: No keys, no game files
      options:
        - label: Nothing attached here contains keys, game files or data extracted from a game.
          required: true
