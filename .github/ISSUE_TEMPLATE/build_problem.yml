name: Build problem
description: Building a game, or installing it to a device, fails
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A build fails at one step with one message; the fields below find it.
        **Never attach game files, keys, title keys or anything extracted from a game.** Logs and screenshots are fine.
        If the game builds but then crashes, freezes or looks wrong, use the Game problem form.
  - type: dropdown
    id: step
    attributes:
      label: Which step failed
      description: The stage the Builds page shows in red, or the last stage line in the Build log.
      options:
        - The key check, before the build
        - Decompress NSZ, or build the extract tool
        - Extract the game (NSP / XCI, update, DLC)
        - Rewrite (the game's code)
        - Shader capture or shader split
        - Mac shaders or iOS shaders
        - Mac host (building the Mac player)
        - Pipeline prebuild or Pipeline archive
        - Prepare Xcode, app build or IPA pack
        - Mac app (packing the app)
        - Install to an iPhone or iPad (Xcode, devicectl)
        - Updating the build tools
        - Something else
        - Not sure
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: The message
      description: The error the launcher shows or the red line in the log, copied as text. A screenshot is welcome too.
    validations:
      required: true
  - type: textarea
    id: buildlog
    attributes:
      label: Build log
      description: In the launcher, the Builds page > Build log. Paste the whole log, or attach it as a file if it is long.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Copy diagnostics
      description: In the launcher, Settings > Copy diagnostics, then paste it here. It holds the app version, the build tools' commit, Python and .NET, and the dependency check. Keys are left out and your home folder is shortened to `~`.
      render: markdown
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game, title ID and versions
      description: The game's name, its title ID, the base version and the update version.
      placeholder: "NieR:Automata The End of YoRHa Edition, 0100B8E016F76000, base 1.0.0, update 1.0.1"
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Built for
      options:
        - This Mac
        - iPhone / iPad
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Game files
      description: What the games folder holds for this game.
      options:
        - NSP
        - NSZ
        - XCI
        - Several of these, or a base game with updates and DLC
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer and OS
      placeholder: MacBook Pro M2 Max, macOS 26.1
    validations:
      required: true
  - type: input
    id: fork-patches
    attributes:
      label: Fork patches line
      description: "The patches your build carries beyond upstream's engine: the first line of the game app's log (`fork patches: ...`), or the contents of `dm/fork_patches.txt` in the NX2Apple folder you built from. Optional."
      placeholder: "fork patches: runtime-profile, romfsarc, ..."
    validations:
      required: false
  - type: checkboxes
    id: no-game-files
    attributes:
      label: No keys, no game files
      options:
        - label: Nothing attached here contains keys, game files or data extracted from a game.
          required: true
