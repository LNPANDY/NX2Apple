blank_issues_enabled: false
contact_links:
  - name: Questions and ideas
    url: https://github.com/LNPANDY/NX2Apple/discussions
    about: Ask how something works in Q&A, or suggest and talk over an idea in Ideas. Bugs stay as issues, with the forms here.
  - name: A game crashes, freezes, runs slowly or looks wrong (seedds/nxnative)
    url: https://github.com/seedds/nxnative/issues
    about: NX2Apple packs and starts games with the nxnative engine. Go there for a game that crashes, freezes, hangs, runs slowly, looks or sounds wrong, or whose controls misbehave once it runs. Also go there for how the engine itself works. Engine fixes and game profiles are submitted there as a pull request, we take no engine patches here.
  - name: Install and build instructions (README)
    url: https://github.com/LNPANDY/NX2Apple#readme
    about: How to install the app, what you need on disk, how to build and install a game, and the games that are known to work.
