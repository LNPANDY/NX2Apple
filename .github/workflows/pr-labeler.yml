# Labels a pull request from the paths it changes (config: .github/labeler.yml).
#
# pull_request_target is used so that PRs from forks get labels too: on a plain
# pull_request event a fork's token is read-only. It is safe here because
# nothing from the PR is checked out or executed. actions/labeler reads the
# config from the base branch and only asks the API for the list of changed
# files. Permissions are minimal, and labels are only added, never removed
# (sync-labels: false), so labels set by hand stay.
name: PR labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
