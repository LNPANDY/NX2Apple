# Taken from seedds/nxnative's tests.yml (.github is not part of the sync, so it is carried here by hand), plus the fork's own front ends: the Mac launcher
# (frontend/, swift test) and the Windows Qt front end's pure-Python tests (frontend-qt/tests). docs/agents/06-dev-loop.md describes the upstream jobs.
# Tests that need no game files, keys or GPU. GitHub's macOS runners are virtual Macs without Metal 4 (issue #112), so the tests that go through mtl_init
# (t_nvn, t_mip_extent, t_rt_range and the rest of dm/gfx/tests' run list) stay local: run `make -C dm/gfx/tests GAME=<id> run` on an Apple-silicon Mac.
# `profile_guess.py --check` stays local too: it compares the guesses with the extractions of the games (it needs their files).
# The engine jobs run in engine/: seedds/nxnative at .upstream-ref plus patches/, made by `tools/engine.py sync` (issue #214). The repository
# commits no engine files (step 2): every job that reads dm/, scripts/ or docs/ syncs first, and pr-scope.yml rejects a change to those paths.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAME: 010015100B514000   # Super Mario Bros. Wonder: the profile the host and gfx tests are built for (any profile does; the tests are about code, not the game)
  # One toolchain everywhere (upstream's dm/tools/tests/test_ci_toolchain.py keeps the name in step
  # with README and the NSP script): the xcode-27 image is GitHub-hosted, arm64, macOS 27 + Xcode 27.1.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment): a tag can be moved, a SHA cannot. Dependabot (github-actions) can raise them.
jobs:
  # Which areas the change touches, so a launcher-only or Qt-only PR skips the engine jobs on the scarce xcode-27 runners.
  # Everything but a pull request (push to main, workflow_dispatch) reports every area as changed. So does any failure to
  # find the diff. The jobs that wait for this one run when it did not succeed, so a broken filter never skips a check.
  # The five required checks (patch-queue, launcher, launcher-qt, tool-tests, triage-scripts) either do not wait for it
  # or are skipped by a job-level if, never by a paths: filter on the workflow (no run would leave the check pending).
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which areas changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          engine=true
          if [ "$EVENT" = pull_request ]; then
            if git fetch --no-tags --depth=1 origin "$BASE" && files=$(git diff --name-only "$BASE" HEAD); then
              echo "$files"
              # What the engine jobs read: engine/ is made from .upstream-ref and patches/ by tools/engine.py (dm/, scripts/ and docs/ are
              # listed in case a change reaches them), the iOS shell package, and this file. A launcher (frontend/) or Qt (frontend-qt/)
              # change alone leaves them out. Anything else (docs, .github/scripts) is no input of theirs either.
              if echo "$files" | grep -Eq '^(dm/|scripts/|docs/|ref/|patches/|tools/|\.upstream-ref$|frontend-ios/|\.github/workflows/tests\.yml$)'; then
                engine=true
              else
                engine=false
              fi
            else
              echo "::warning::No diff against the base, so every area counts as changed"
            fi
          fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "engine=$engine"

  host-tests:
    name: Host unit tests and CPU-only gfx tests
    runs-on: xcode-27
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Engine (tools/engine.py sync, issue #214)
        working-directory: .
        run: python3 tools/engine.py sync
      - name: Host unit tests (dm/host/tests)
        run: |
          mkdir -p logs
          make -C dm/host/tests GAME="$GAME" -j3 run 2>&1 | tee logs/host-tests.log
      - name: ThreadSanitizer (audio, HID and guest memory)
        run: |
          make -C dm/host/tests GAME="$GAME" -j3 tsan memory-tsan 2>&1 | tee logs/tsan.log
      - name: Thermal cap and ThreadSanitizer (concurrent frame-cap readers)
        run: |
          make -C dm/gfx/tests GAME="$GAME" -j3 check_t_thermal thermal-tsan 2>&1 | tee logs/thermal.log
      - name: CPU texture layout and deswizzle tests
        run: |
          make -C dm/gfx/tex/tests t_tex 2>&1 | tee logs/texture-build.log
          dm/gfx/tex/tests/t_tex 2>&1 | tee logs/texture-tests.log
      - name: CPU-only gfx tests (dm/gfx/tests)
        run: |
          mkdir -p logs
          cd dm/gfx/tests
          make GAME="$GAME" -j3 t_perf_order
          ./t_perf_order --cpu 2>&1 | tee ../../../logs/t_perf_order.log
          make GAME="$GAME" -j3 perf-order-tsan 2>&1 | tee ../../../logs/t_perf_order-tsan.log
          tests="t_dirty_slots t_dirty_race t_tex_layout t_pace t_fstep t_link_ticks t_cpu_tex t_hmap t_cover t_pso_skey t_refl t_rt_range_ro t_present_rescue t_gpuprof"
          make GAME="$GAME" -j3 $tests 2>&1 | tee ../../../logs/gfx-build.log
          failed=0
          for t in $tests; do
            echo "::group::$t"
            ./$t 2>&1 | tee "../../../logs/$t.log" && rc=0 || rc=1   # pipefail: the test's status
            echo "::endgroup::"
            if [ "$rc" != 0 ]; then echo "::error::$t failed"; failed=1; fi
          done
          exit $failed
      - name: Direct OpenGL imports and EGL lookup (no GPU)
        run: make -C dm/gfx/tests GAME="$GAME" gl-imports 2>&1 | tee logs/gl-imports.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-host-tests
          path: engine/logs
          retention-days: 7

  tool-tests:
    name: Tool tests
    runs-on: xcode-27
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Engine (tools/engine.py sync, issue #214)
        working-directory: .
        run: python3 tools/engine.py sync
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml   # no requirements file: the packages are listed in the step below
      - name: Install the Python packages the tools import
        run: python -m pip install lz4 capstone fonttools   # backports.zstd is for Python before 3.14 only
      # The shader translator's tests (test_image_atomic_bounds, test_dmsh_geometry) run the committed translator on synthetic Maxwell shaders, then spirv-val and the committed spirv-cross:
      # one translation chain serves every game, so these are what checks a translator change on games its author does not own (GitHub issue #272). Compiling their MSL with
      # Metal (DMSH_TEST_METAL=1) and running it on the GPU (DMSH_TEST_GPU=1) stay local.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'   # dm/gfx/tools/dmsh_xlate_bin targets net10.0
      - name: Install spirv-val   # spirv-cross is the in-repo build (dm/gfx/tools/spirv_cross_bin)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install spirv-tools
      - name: Run the test files
        env:
          DM_GAME: ${{ env.GAME }}   # test_tbdr_budget runs a tool that needs a profile
          DMSH_TEST_XLATE: ${{ github.workspace }}/engine/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
        run: |
          mkdir -p logs
          failed=0
          for f in dm/tools/tests/test_*.py dm/ios/tests/test_*.py dm/gfx/tests/test_*.py; do
            echo "::group::$f"
            python -m unittest -v "$f" 2>&1 | tee "logs/$(basename "$f").log" || { echo "::error::$f failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-tool-tests
          path: engine/logs
          retention-days: 7

  patch-queue:
    name: Patch queue (series applies to the pin, tool tests, dry bump against seedds main, issues #123 and #214)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      # tools/engine.py check: the headers are complete, no patch touches the shader chain or the generated files, and the series applies
      # cleanly to the pinned upstream (.upstream-ref) with no empty patch. engine.py fetches the pinned commit itself. The dry bump to seedds
      # main only reports (the nightly sync opens the PR or the issue); it lists the patches that would conflict.
      - name: Patch queue check
        run: |
          python tools/engine.py check || {
            echo "::error title=Patch queue::The series does not apply to the pin, or a patch header is incomplete. Fix: work in engine/ (python3 tools/engine.py sync), commit there, then python3 tools/engine.py export. See patches/README.md."
            exit 1
          }
      - name: Engine (tools/engine.py sync, issue #214; the tool tests read engine/)
        run: python tools/engine.py sync
      - name: Install ripgrep (the engine/ search test)
        run: sudo apt-get install -y -qq ripgrep > /dev/null
      - name: Install the signing tool's package (tools/release_manifest.py)
        run: python -m pip install -r tools/requirements-release.txt
      - name: Patch, engine and release tool tests
        run: python -m unittest -v tools/tests/test_patches.py tools/tests/test_engine.py tools/tests/test_release_manifest.py
      - name: Dry bump to seedds main (report only)
        run: python tools/engine.py bump --dry --to main || true

  build:
    name: Build check (Mac host, gfx tests, iOS sources)
    runs-on: xcode-27
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Engine (tools/engine.py sync, issue #214)
        working-directory: .
        run: python3 tools/engine.py sync
      - name: Mac host for three profiles (Vulkan, NVN, OpenGL)
        run: |
          mkdir -p logs
          # Wonder: NVN; Hades: Vulkan; Digimon Story Cyber Sleuth: OpenGL. The second and third reuse the libvpx build in dm/host/gen/vpx.
          for g in 010015100B514000 0100535012974000 010014E00DB56000; do
            echo "::group::dmhost $g"
            make -C dm/host GAME=$g -j3 dmhost 2>&1 | tee "logs/dmhost-$g.log"
            test -x dm/host/dmhost
            echo "::endgroup::"
          done
      - name: Every gfx test compiled, not run
        run: |
          mkdir -p logs
          cd dm/gfx/tests
          tests=$(sed -n 's/^\(t_[a-z0-9_]*\):.*/\1/p' Makefile | sort -u)
          echo "$tests" | tr '\n' ' '; echo
          make GAME="$GAME" -j3 $tests 2>&1 | tee ../../../logs/gfx-tests-build.log
      - name: iOS host sources compiled for the iPhone SDK (no signing, no Xcode project)
        run: python3 dm/ios/tools/compile_check.py 2>&1 | tee logs/ios-compile.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-build
          path: engine/logs
          retention-days: 7

  launcher:
    name: Mac launcher (frontend, swift test)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Engine (tools/engine.py sync, issue #214; the launcher's tests read engine/)
        run: python3 tools/engine.py sync
      - name: Release build
        working-directory: frontend
        run: |
          mkdir -p ../logs
          swift build -c release 2>&1 | tee ../logs/launcher-build.log
      # The opt-in tests (a real games folder, the README screenshots, the visual QA capture) skip without their variables; the process
      # fixtures stand in for the NSP script, xcodebuild and devicectl, so nothing is built, signed or installed
      - name: Tests
        working-directory: frontend
        run: swift test 2>&1 | tee ../logs/launcher-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-launcher
          path: logs
          retention-days: 7

  shell-package:
    name: iOS shell package (frontend-ios, swift test)
    runs-on: xcode-27
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The views, the host layer (catalogue from embedded frameworks, the engine launch plan, settings, bookmarks) and the
      # controller mapping, on the Mac (the package also builds for macOS); the UI tests need a Simulator and stay local
      - name: Tests
        working-directory: frontend-ios
        run: |
          mkdir -p ../logs
          swift test 2>&1 | tee ../logs/shell-package-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-shell-package
          path: logs
          retention-days: 7

  launcher-qt:
    name: Qt front end (frontend-qt tests)
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      # Pure Python: the Windows toolchain, IPA and shim logic with the system calls mocked; the few tests that need PySide6 skip without it
      - name: Engine (tools/engine.py sync, issue #214; some tests read engine/)
        run: python tools/engine.py sync
      - name: Tests
        run: python -m unittest discover -s frontend-qt/tests -v
      # The Qt table is generated from the SwiftUI one and says so at its top. A string added to
      # Localization.swift without regenerating it left 18 keys missing here for a day (a source run
      # of the Qt app shows those as raw keys), so the regeneration is the check: any difference
      # means the committed table is stale.
      - name: The Qt language table matches Localization.swift
        run: |
          python frontend-qt/gen_localization.py
          git diff --exit-code -- frontend-qt/nspb_qt/localization.py

  triage-scripts:
    name: Triage script tests (.github/scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      # Pure Python: the issue triage's log extractor and symptom matcher, and the strict validator of the model's output
      - name: Engine (tools/engine.py sync, issue #214; the symptom index tests read engine/docs)
        run: python tools/engine.py sync
      - name: Tests
        run: python -m unittest discover -s .github/scripts/tests -v

  ios-build:
    name: Unsigned iOS app (synthetic modules, Swift and link)
    runs-on: xcode-27
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Engine (tools/engine.py sync, issue #214)
        working-directory: .
        run: python3 tools/engine.py sync
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build the production iOS project with synthetic inputs
        run: |
          mkdir -p logs
          python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke" 2>&1 | tee logs/ios-build.log
      # Route C M1 (docs/launcher-c-plan.md): XcodeGen and xcodebuild of the DmGame framework target from a synthetic Gen/.
      # test_framework_build.py's packaging half runs in tool-tests; its link half needs xcodegen, installed only here.
      - name: The game framework links the module sections (route C M1)
        run: python3 -m unittest -v dm/ios/tests/test_framework_link.py 2>&1 | tee logs/framework-link.log
      # Route C M2: build_shell.sh generates and builds the shell (host, frontend-ios package, a synthetic framework embedded and not
      # linked). make_ext_font.py needs fontTools, which only this step installs
      - name: The shell app embeds a game framework and builds (route C M2)
        run: |
          python3 -m pip install --user --break-system-packages fonttools > /dev/null
          python3 -m unittest -v dm/ios/tests/test_shell_build.py 2>&1 | tee logs/shell-build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-ios-build
          path: engine/logs
          retention-days: 7
