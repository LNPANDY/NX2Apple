# Guard the patch queue: fail a PR that edits a vendored file without a patch.
#
# dm/, scripts/, docs/, ref/ and AGENTS.md are upstream (seedds/nxnative, pinned in .upstream-ref) plus the patches in
# patches/. A PR that edits one of those files directly would be reverted by the next bump, so `scripts/patches.py check`
# (the series applied to the pin must give the committed tree) fails it. What a PR author sees: the files that differ, and the
# way out (commit the change, `scripts/patches.py export <commit>`, fill in the header; patches/README.md).
# A sync PR (branch sync/upstream-*) is checked too, on purpose: it must reproduce its own tree. The old per-file guard
# and its skip for sync branches are gone with the anchor patchers.
# The same check is a job in tests.yml; this one starts on the vendored paths only, and says so in its own name.
name: PR scope (sync safety)

on:
  pull_request:
    paths: ['dm/**', 'scripts/**', 'docs/**', 'ref/**', 'AGENTS.md', 'patches/**', '.upstream-ref']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pinned upstream commit
        run: |
          git remote add seedds https://github.com/seedds/nxnative.git
          git fetch --no-tags seedds "$(cat .upstream-ref)"
      - name: The series reproduces the vendored tree
        run: |
          python3 scripts/patches.py check || {
            echo "::error title=Patch queue::Patch queue out of sync: vendored files differ from pin + patches. Fix: python3 scripts/patches.py absorb <the files listed above> (a new file may need --into <patch>), then commit patches/. See patches/README.md."
            exit 1
          }
