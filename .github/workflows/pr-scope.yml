# Guard the patch queue: fail a PR whose patches do not apply to the pin, or that edits a committed vendored file without a patch.
#
# The engine is seedds/nxnative at the commit in .upstream-ref plus the patches in patches/. Since issue #214 it is built into engine/
# by `tools/engine.py sync`, and engine work is a commit in engine/ that `tools/engine.py export` turns into a patch. While the
# repository still commits the same tree in dm/, scripts/, docs/, ref/ and AGENTS.md (step 1 of #214), a PR that edits one of those
# files directly would be reverted by the next bump, so `tools/engine.py check --tree` also compares that tree with pin + series. What a
# PR author sees: the files that differ, and the way out (patches/README.md). In step 2 the committed tree goes, and this guard keeps
# only the first half: the series applies cleanly to the pin.
# A sync PR (branch sync/upstream-*) is checked too, on purpose: it must reproduce its own tree.
# The same check is a job in tests.yml; this one starts on the engine's paths only, and says so in its own name.
name: PR scope (sync safety)

on:
  pull_request:
    paths: ['dm/**', 'scripts/**', 'docs/**', 'ref/**', 'AGENTS.md', 'patches/**', '.upstream-ref', 'tools/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The series applies to the pin, and the committed tree is pin + series
        run: |
          python3 tools/engine.py check --tree || {
            echo "::error title=Patch queue::The series does not apply to the pin, or a committed vendored file differs from pin + patches. Fix: work in engine/ (python3 tools/engine.py sync), commit there, then python3 tools/engine.py export. A direct edit of a committed file folds in with python3 tools/patches.py absorb <files>. See patches/README.md."
            exit 1
          }
