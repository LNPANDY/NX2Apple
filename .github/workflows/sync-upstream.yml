# Daily: follow upstream seedds/nxnative as a patch queue (issue #123, patches/README.md). The engine
# is upstream at a pinned commit (.upstream-ref) plus the patches in patches/; tools/engine.py bump
# moves the pin, re-applies the series, drops the patches that landed upstream, and leaves the rest
# for review. The PR touches only .upstream-ref and patches/ (the repository commits no engine files,
# issue #214), and the checks run on engine/ (tools/engine.py sync).
# Nothing is pushed to main (it is protected): the result is a pull request from the branch
# sync/upstream-<short sha> (or, when a patch no longer applies, an issue naming it).
#
# A PR opened with the default GITHUB_TOKEN does not start other workflows (GitHub's rule), so this job
# runs the checks itself before it opens the PR. A repository secret SYNC_TOKEN (a fine-grained token
# with contents, pull requests and issues write) makes the PR start tests.yml as well.
#
# The experimental engine channel (LNPANDY/NX2Apple#227): it is built and published from main only, and only after the nightly bump of the sync
# job went green (the pin moved and every check passed, or upstream had nothing new). The publish-experimental job runs only on the ref
# refs/heads/main, so a manual run on a pull request branch or any other ref never builds it and never sees the signing key. It builds
# the engine tree of main (tools/engine.py tree), writes latest.json with channel "experimental" and "built", and replaces the assets
# (NX2Apple-engine.zip, latest.json, latest.json.sig) of the pre-release tag engine-experimental, which it creates when missing and keeps a
# pre-release that is never "latest". A workflow artifact cannot serve: the launcher has no token. An engine that is already published
# is not uploaded again. The bump itself is a pull request: its engine reaches this channel after it is merged.
# The repository secret ENGINE_SIGNING_KEY is optional for now: with it latest.json.sig is made, without it the engine goes out unsigned and
# the log says so. Signing becomes mandatory before any download source other than GitHub is added (LNPANDY/NX2Apple#268, Cloudflare R2).
# A failure of the publish job (a wrong key) never opens the "sync blocked" issue.
name: Sync upstream

on:
  schedule:
    - cron: '30 21 * * *'   # 21:30 UTC = 5:30 Beijing
  workflow_dispatch:
    inputs:
      force_experimental:
        description: "Publish the engine of main to the engine-experimental tag even when that engine is already there (a run on main only)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: macos-latest   # the host build needs clang + macOS headers
    outputs:
      bump: ${{ steps.bump.outputs.changed }}   # yes (a PR was opened), no (already at upstream), conflict
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upstream main
        run: |
          NEW=$(git ls-remote https://github.com/seedds/nxnative.git refs/heads/main | cut -f1)
          [[ "$NEW" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot read seedds/nxnative main"; exit 1; }
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          echo "OLD=$(cat .upstream-ref)" >> "$GITHUB_ENV"

      - name: Bump the pin and re-apply the patches
        id: bump
        run: |
          if [ "$OLD" = "$NEW" ]; then echo "Already at $NEW"; echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          python3 tools/engine.py bump --to "$NEW" 2>&1 | tee bump.log
          rc=${PIPESTATUS[0]}
          if [ $rc -eq 0 ]; then echo "changed=yes" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 1 ]; then echo "changed=conflict" >> "$GITHUB_OUTPUT"
          else echo "changed=error" >> "$GITHUB_OUTPUT"; exit $rc; fi

      - name: Check the patch queue
        if: steps.bump.outputs.changed == 'yes'
        run: |
          python3 tools/engine.py check
          python3 tools/engine.py sync
          python3 -m unittest discover tools/tests
          # every .py parses on the Python this fork supports as its floor, the iOS build script survives bash -n
          python3 -m compileall -q engine/scripts engine/dm/tools engine/dm/games engine/dm/mac > /dev/null
          bash -n engine/dm/ios/tools/build_ipa.sh
          GAME=$(ls engine/dm/games | grep '^0100' | head -1)
          make -C engine/dm/host GAME=$GAME dmhost -j4 2>&1 | tail -20

      - name: Commit to a sync branch and open a pull request
        id: pr
        if: steps.bump.outputs.changed == 'yes'
        # main is protected (a pull request is required, force pushes and deletions are
        # blocked, and the rules apply to everyone including the owner and this bot), so the
        # sync result goes to a branch and a PR instead of straight to main. A person merges it.
        # -R, because gh would otherwise resolve the target repository from the remotes
        # (daily-health.yml has the full note).
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@users.noreply.github.com"
          SHORT=${NEW:0:7}
          git add -A patches .upstream-ref
          if git diff --cached --quiet; then echo "nothing to sync"; exit 0; fi
          git checkout -b "sync/upstream-$SHORT"
          git commit -m "Sync upstream $SHORT"
          git push -u origin "sync/upstream-$SHORT"
          echo "branch=sync/upstream-$SHORT" >> "$GITHUB_OUTPUT"
          {
            echo "The patch queue re-applied on upstream \`${NEW:0:12}\` (was \`${OLD:0:12}\`): every patch applied, and \`tools/engine.py check\`, the tests and a macOS host build passed. Merging brings seedds/nxnative to \`$NEW\`."
            echo
            echo "Upstream: https://github.com/seedds/nxnative/compare/${OLD:0:12}...${NEW:0:12}"
            echo
            echo '```'
            tail -40 bump.log
            echo '```'
            echo
            echo "Patches listed under dropped landed upstream; their files are deleted from patches/. \`tools/engine.py status\` lists what is still carried."
          } > body.md
          gh pr create -R "${{ github.repository }}" --base main --head "sync/upstream-$SHORT" \
            --title "Sync upstream $SHORT" --body-file body.md || echo "PR creation failed; the branch is pushed"


      - name: Open an issue when a patch conflicts
        if: steps.bump.outputs.changed == 'conflict' || failure()
        run: |
          tail -60 bump.log > tail.log 2>/dev/null || echo "see the workflow log" > tail.log
          TITLE="Upstream sync blocked at ${NEW:0:7}"
          {
            echo "The nightly bump to \`${NEW:0:12}\` stopped at a patch that no longer applies. main is untouched. Whoever owns the patch refreshes it:"
            echo "run \`tools/engine.py bump --to ${NEW:0:12}\` locally, resolve the conflict in the worktree it names, \`git am --continue\`, then \`tools/engine.py refresh <worktree> --to ${NEW:0:12}\` (patches/README.md)."
            echo
            echo '```'
            cat tail.log
            echo '```'
          } > issue.md
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "Upstream sync blocked in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue edit "$N" -R "${{ github.repository }}" --title "$TITLE" --body-file issue.md
          else
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body-file issue.md || echo "issue creation failed; the log is in the workflow run"
          fi

  publish-experimental:
    # Main only, and only after a green bump. The ref test is what keeps a run on another ref (a manual run on a pull request branch) from
    # building and publishing: the job then never starts. Separate from the sync job so that a publishing problem (a wrong key, no release
    # permission) does not read as a blocked sync above.
    needs: sync
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.sync.result == 'success' &&
      (needs.sync.outputs.bump == 'yes' || needs.sync.outputs.bump == 'no')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: engine-experimental   # two runs must not replace the assets at the same time
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ENGINE_SIGNING_KEY: ${{ secrets.ENGINE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}   # the main commit this run started on, never a sync branch
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r tools/requirements-release.txt

      - name: Signing key (a warning when the secret is not set, a failure when it is not the key in frontend/engine-signing.pub)
        run: python tools/release_manifest.py check-key --pub frontend/engine-signing.pub

      - name: "Main's tests must be green"
        run: |
          c=$(gh run list -R "${{ github.repository }}" --workflow tests.yml --branch "${{ github.event.repository.default_branch }}" --event push --limit 1 --json conclusion --jq '.[0].conclusion')
          echo "latest tests.yml on main: ${c:-none}"
          [ "$c" = "success" ] || { echo "::error::tests.yml on main is not green: not publishing"; exit 1; }

      - name: Build the engine tree
        run: |
          python tools/engine.py sync
          python tools/engine.py tree --out "$RUNNER_TEMP/engine-tree" --zip "$RUNNER_TEMP/engine-out/NX2Apple-engine.zip"

      - name: Is this engine already published?
        id: published
        run: |
          new=$(cat "$RUNNER_TEMP/engine-tree/.engine-id")
          old=$(gh release download engine-experimental -R "${{ github.repository }}" -p latest.json -O - 2> /dev/null | python -c 'import json, sys; print(json.load(sys.stdin).get("engine_id", ""))' 2> /dev/null || true)
          echo "published: ${old:-none}, main: $new"
          if [ "$new" = "$old" ] && [ "${{ inputs.force_experimental }}" != "true" ]; then
            echo "same=yes" >> "$GITHUB_OUTPUT"
            echo "Already published: nothing to upload."
          fi

      - name: Publish to the engine-experimental pre-release
        if: steps.published.outputs.same != 'yes'
        run: |
          APPV=$(sed -n 's/.*static let appVersion = "\(.*\)".*/\1/p' frontend/Sources/NX2Apple/ContentView.swift)
          python tools/release_manifest.py publish \
            --engine-zip "$RUNNER_TEMP/engine-out/NX2Apple-engine.zip" \
            --version "$APPV-experimental" --channel experimental --tag engine-experimental \
            --out "$RUNNER_TEMP/publish" --upload
