# Daily: check the fork's health without changing anything. Separate from sync-upstream.yml on
# purpose — that workflow can fail silently (its own issue step needs a permission it may not have),
# so this one reports on the state of the tree rather than on a sync attempt:
#   - the last sync is recent (catches a schedule that stopped firing, or a run that died early)
#   - the patchers still reproduce the tree (catches a source fix without its patcher entry)
#   - the host builds and the host unit tests pass (catches a fork change that broke a test rule)
#   - upstream has not moved without a sync (catches a failed sync that left no issue)
# A problem opens an issue with the log; a clean run just succeeds. No push, ever.
name: Daily health check

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 6:00 Beijing, before the sync at 21:30 UTC has aged a day
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the patcher check compares against upstream/main

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/seedds/nxnative.git
          git fetch upstream main   # whole history: the dry run below needs the last sync base (.upstream-ref), not only the tip

      - name: Health check
        id: check
        run: |
          set -o pipefail
          {
            echo "=== last sync ==="
            LAST=$(cat .upstream-ref 2>/dev/null || echo none)
            echo ".upstream-ref: $LAST"
            if [ "$LAST" != none ]; then
              AGO=$(( ( $(date +%s) - $(git log -1 --format=%ct "$(git rev-list -1 --all --grep="Sync upstream" | head -1)" 2>/dev/null || date +%s) ) / 3600 ))
              echo "last sync commit age: ${AGO}h"
              [ "$AGO" -gt 48 ] && echo "PROBLEM: no sync for ${AGO}h (the schedule should run daily)"
            fi

            echo
            echo "=== upstream drift ==="
            NEW=$(git rev-parse upstream/main)
            echo "upstream/main: $NEW"
            if [ "$LAST" != none ] && [ "$LAST" != "$NEW" ]; then
              BEHIND=$(git rev-list --count "$LAST..$NEW" 2>/dev/null || echo '?')
              echo "commits upstream since the last sync: $BEHIND"
            fi

            echo
            echo "=== patcher consistency ==="
            # The dry run uses the real base, as the sync workflow does (--old "$NEW" made every file upstream added since
            # the last sync read as a fork edit). Without .upstream-ref it falls back to $NEW, as the sync does.
            BASE=$LAST; [ "$BASE" != none ] || BASE=$NEW
            python3 scripts/sync_upstream.py --old "$BASE" --new "$NEW" --skip-build 2>&1 | tail -40
          } 2>&1 | tee check.log

      - name: Host build and unit tests
        run: |
          set -o pipefail
          GAME=$(ls dm/games | grep '^0100' | head -1)
          echo "=== host build ($GAME) ===" | tee -a check.log
          make -C dm/host GAME=$GAME dmhost -j4 2>&1 | tail -20 | tee -a check.log
          echo "=== host unit tests ===" | tee -a check.log
          make -C dm/host/tests GAME=$GAME run -j4 2>&1 | tail -30 | tee -a check.log

      - name: Report a problem
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -R is not optional: the job adds an `upstream` remote (seedds/nxnative) to fetch, and gh
        # picks its target repository by remote — the second one, not origin — so without this the
        # issue went to upstream, where this token has no write access ("Resource not accessible by
        # integration (createIssue)", 2026-10-27). A probe with the same permissions created the
        # issue on the first try once -R named the fork.
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "Daily health check failed $(date -u +%Y-%m-%d)" \
            --body "The daily check found a problem. Nothing was changed — the tree on main is as it was.

          \`\`\`
          $(tail -60 check.log 2>/dev/null || echo 'see the workflow log')
          \`\`\`

          Common causes: a fork source change without its patcher entry (patcher drift), a test rule that no longer links a new dependency, or a sync that has not run for over two days." \
            || echo "issue creation failed; the log is in the workflow run"
