# Issue triage and log first aid, run by the GitHub Copilot CLI on a Copilot subscription (see .github/triage/README.md for the cost).
#
# Three jobs, each with the least it needs; the issue text is untrusted, so the model never holds a write token:
#   gather   issues: read, no secrets   reads the issue, extracts log signals, matches docs/agents/symptoms.md, finds duplicate candidates
#   analyze  no permissions, the model token   the Copilot CLI answers one JSON object; it can only read (--available-tools=view), in an empty directory
#   apply    issues: write, no model token     validates the JSON strictly (.github/scripts/triage_apply.py), then adds labels and, only in post mode, posts one comment (report mode, the default: job summary and artifact instead)
# The workflow never closes an issue, edits code, removes a label or runs on pull_request_target. Without the COPILOT_TOKEN secret it skips with a notice.
# Setup: README of this change in .github/triage/README.md. Tests: python3 -m unittest discover -s .github/scripts/tests
name: issue-triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to triage again (an earlier triage comment is updated, not duplicated)
        required: true
        type: string
      triage_mode:
        description: "report (labels only; the comment goes to the job summary) or post (also comment); empty uses the repository variable TRIAGE_MODE, default report"
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue_number }}

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment), as in tests.yml.
jobs:
  gather:
    name: Gather (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
    steps:
      - name: Issue number
        run: |
          [[ "$ISSUE" =~ ^[0-9]{1,9}$ ]] || { echo "::error::not an issue number"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the data for the model
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/triage_prepare.py --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" --out "$RUNNER_TEMP/triage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.skip == 'false'
        with:
          name: triage-input
          path: ${{ runner.temp }}/triage
          retention-days: 3

  analyze:
    name: Analyze (model, no write token)
    needs: gather
    if: needs.gather.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      ran: ${{ steps.copilot.outputs.ran }}
    env:
      COPILOT_TOKEN_SET: ${{ secrets.COPILOT_TOKEN != '' }}
    steps:
      - name: Secret check
        id: secret
        run: |
          if [ "$COPILOT_TOKEN_SET" != "true" ]; then
            echo "::notice::COPILOT_TOKEN is not set: triage skipped. It is a fine-grained PAT with only the 'Copilot Requests' permission."
          fi
          echo "set=$COPILOT_TOKEN_SET" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.secret.outputs.set == 'true'
        with:
          name: triage-input
          path: ${{ runner.temp }}/triage
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secret.outputs.set == 'true'
        with:
          node-version: '22'
      - name: Install the Copilot CLI
        if: steps.secret.outputs.set == 'true'
        run: npm install --global --ignore-scripts @github/copilot@1.0.105   # pinned: bump on purpose
      - name: Ask Copilot
        id: copilot
        if: steps.secret.outputs.set == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}   # optional repository variable (a model id, e.g. claude-haiku-4.5); unset keeps GitHub's default
        run: |
          # An empty directory holds nothing to read. The model can only call `view`; shell, file writes and URLs are denied
          # (deny rules win over --allow-all-tools, which prompt mode needs), no MCP servers, no repository instructions.
          mkdir -p "$RUNNER_TEMP/empty"
          cd "$RUNNER_TEMP/empty"
          model=()
          if [ -n "$TRIAGE_MODEL" ]; then
            [[ "$TRIAGE_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo "::error::TRIAGE_MODEL is not a model id"; exit 1; }
            model=(--model "$TRIAGE_MODEL")   # one argument, never part of a shell string
            echo "model: $TRIAGE_MODEL"
          fi
          # prompt.txt is at most 90000 bytes (triage_prepare.py), below the 128 KiB limit of one argument
          timeout 300 copilot "${model[@]}" -p "$(cat "$RUNNER_TEMP/triage/prompt.txt")" --silent --no-ask-user --no-custom-instructions \
            --no-auto-update --disable-builtin-mcps --disable-client-telemetry \
            --available-tools=view --allow-all-tools --deny-tool=shell --deny-tool=write --deny-tool=url \
            --secret-env-vars=COPILOT_GITHUB_TOKEN > "$RUNNER_TEMP/triage/result.txt"
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.copilot.outputs.ran == 'true'
        with:
          name: triage-result
          path: ${{ runner.temp }}/triage/result.txt
          retention-days: 3

  apply:
    name: Apply (validated labels and one comment)
    needs: analyze
    if: needs.analyze.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: triage-*
          path: ${{ runner.temp }}/triage
          merge-multiple: true
      - name: Validate and apply
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAGE_MODE: ${{ inputs.triage_mode || vars.TRIAGE_MODE }}   # exactly "post" posts; anything else is report
        run: |
          mkdir -p "$RUNNER_TEMP/triage-report"
          python3 -I .github/scripts/triage_apply.py --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --input "$RUNNER_TEMP/triage/input.json" --result "$RUNNER_TEMP/triage/result.txt" --report-dir "$RUNNER_TEMP/triage-report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles(format('{0}/triage-report/*.md', runner.temp)) != ''
        with:
          name: triage-report-${{ env.ISSUE }}
          path: ${{ runner.temp }}/triage-report/triage-${{ env.ISSUE }}.md
          retention-days: 30
