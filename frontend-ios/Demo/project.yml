name: ShellDemo
options:
  bundleIdPrefix: dev.shellui
  deploymentTarget:
    iOS: '26.0'
packages:
  ShellUI:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown'
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: Shell Demo
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  ShellDemoApp:
    type: application
    platform: iOS
    sources:
      - ../Sources/ShellDemo
      - path: ReviewCatalog
        type: folder
        buildPhase: resources
        optional: true
      # The fixture bundles for --host, copied into the app as its Games folder. No game data, no pictures.
      - path: ../Tests/ShellHostTests/Fixtures/Games
        type: folder
        buildPhase: resources
      - path: ../AppIcon.icon   # the app icon, shared with the shell app (frontend-ios/Shell/project-shell.yml)
    info:
      path: Gen/Info.plist
      properties:
        CFBundleLocalizations: [en, de, es, fr, it, ja, ko, pt-BR, sv, zh-Hans]   # every file of frontend/l10n (tools/l10n_shell_catalogs.py), so iOS offers them to the package bundles
        CFBundleURLTypes:
          - CFBundleURLName: dev.nx2apple.shell.url
            CFBundleURLSchemes: [nx2apple]
    dependencies:
      - package: ShellUI
        product: ShellUI
      - package: ShellUI
        product: ShellControllers
      - package: ShellUI
        product: ShellHost
      - target: ShellDemoWidget
  ShellDemoWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - ../Sources/ShellUI/Resources/Localizable.xcstrings
    info:
      path: Gen/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Shell Demo
        CFBundleLocalizations: [en, de, es, fr, it, ja, ko, pt-BR, sv, zh-Hans]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.shellui.ShellDemoApp.widget
      SKIP_INSTALL: YES
    dependencies:
      - package: ShellUI
        product: ShellUI
      - package: ShellUI
        product: ShellWidget
  ShellDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../UITests
    dependencies:
      - target: ShellDemoApp
schemes:
  ShellDemo:
    build:
      targets:
        ShellDemoApp: all
    test:
      targets:
        - ShellDemoUITests
